services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "127.0.0.1:8091:8091"
    environment:
      DATABASE_URL: postgresql://lab:lab-only@db:5432/lab
      MOCK_EXTERNAL_URL: http://mock-external:9000
      APP_SECRET: lab-only-not-a-real-secret
    depends_on:
      db:
        condition: service_healthy
      mock-external:
        condition: service_healthy
    networks: [backend, frontend]
    restart: "no"
    init: true
    user: "10001:10001"
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    pids_limit: 128
    cpus: 1.0
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8091/healthz', timeout=3).read()"]
      interval: 3s
      timeout: 4s
      retries: 30

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    environment:
      DATABASE_URL: postgresql://lab:lab-only@db:5432/lab
      MOCK_EXTERNAL_URL: http://mock-external:9000
    depends_on:
      api:
        condition: service_healthy
      db:
        condition: service_healthy
      mock-external:
        condition: service_healthy
    networks: [backend]
    restart: "no"
    init: true
    user: "10001:10001"
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    pids_limit: 64
    cpus: 0.5

  db:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_USER: lab
      POSTGRES_PASSWORD: lab-only
      POSTGRES_DB: lab
    networks: [backend]
    restart: "no"
    tmpfs: [/var/lib/postgresql/data]
    mem_limit: 512m
    pids_limit: 128
    cpus: 1.0
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lab -d lab"]
      interval: 3s
      timeout: 4s
      retries: 30

  mock-external:
    build:
      context: .
      dockerfile: Dockerfile.mock
    networks:
      backend:
        aliases: [other-internal]
    restart: "no"
    user: "10001:10001"
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    pids_limit: 32
    cpus: 0.25
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9000/healthz', timeout=2).read()"]
      interval: 3s
      timeout: 3s
      retries: 20

networks:
  backend:
    internal: true
  frontend:

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-security-reviewer-v2"
version = "0.1.0"
description = "Multi-scanner agentic pre-deployment security reviewer"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "Flask>=3.1,<4",
    "langgraph>=1.2,<1.3",
    "waitress>=3,<4",
    "keyring>=25,<26",
    "psutil>=6,<8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "ruff>=0.17,<0.18",
]
scanners = [
    "semgrep==1.178.0",
]

[project.scripts]
security-project-profile = "security_reviewer_v2.profiler.cli:main"
security-scan-codeql = "security_reviewer_v2.orchestrator.codeql_cli:main"
security-normalize-codeql = "security_reviewer_v2.normalization.cli:main"
security-normalize-findings = "security_reviewer_v2.normalization.cli:main"
security-merge-findings = "security_reviewer_v2.normalization.merge_cli:main"
security-collect-context = "security_reviewer_v2.context.cli:main"
security-collect-candidate-context = "security_reviewer_v2.context.candidate_cli:main"
security-prioritize-findings = "security_reviewer_v2.prioritization.cli:main"
security-test-environment = "security_reviewer_v2.test_environment.cli:main"
security-reviewer-web = "security_reviewer_v2.web.app:main"


[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"security_reviewer_v2.web" = ["templates/*.html", "static/*.css", "static/*.js"]
"security_reviewer_v2.scanners" = ["rules/*.yml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = [
    "E4", "E7", "E9", "F", "I",
    "C405", "C408", "C409", "FLY002", "FURB167",
    "ISC004", "RUF022", "RUF059",
]
# These rules require case-by-case exception design and can change runtime
# error handling or failure boundaries when applied mechanically.
ignore = ["BLE001", "E402", "SIM102", "SIM117", "TRY004"]
